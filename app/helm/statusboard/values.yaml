# Default values for the StatusBoard chart.
# Environment-specific values live in ../environments/staging.yaml and prod.yaml.
# CI (GitHub Actions) also sets image.repository, image.tag, ingress.host and backup.bucket.

nameOverride: ""
fullnameOverride: ""

# -- "staging" or "production". Anything except "production" shows a banner on the page.
environment: staging

image:
  # -- Overridden by CI with the ECR repository URI
  repository: statusboard
  # -- Overridden by CI with the Git commit SHA. The SAME tag is promoted from staging to prod.
  tag: ""
  pullPolicy: IfNotPresent

app:
  # -- Used only when autoscaling is disabled
  replicas: 2
  siteName: StatusBoard
  # -- Components created on first start when the database is empty
  seedComponents: [Website, Public API, Payments, Notifications]
  cacheTTL: 30s
  # -- Seconds to keep serving after shutdown starts, while the ALB stops sending traffic
  preStopSleepSeconds: 10
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

# PostgreSQL is run by the Zalando postgres-operator (installed by Terraform):
# one primary + replicas, each in its own Availability Zone, automatic failover.
postgres:
  # -- Number of database pods: 1 primary + (instances - 1) streaming replicas
  instances: 3
  # -- PostgreSQL major version (the operator's Spilo image supports 14-18)
  version: "17"
  # -- true = every write also reaches a replica before it is confirmed (no data loss on failover)
  synchronousMode: true
  database: statusboard
  user: statusboard
  # -- Client tools image for backups and exports (pg_dump, psql); keep it >= the server version
  image:
    repository: postgres
    tag: "17-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    # -- StorageClass created by Terraform (EBS gp3, encrypted, WaitForFirstConsumer)
    storageClass: gp3
    size: 10Gi

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "9.2-alpine"
  maxMemory: 64mb
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 96Mi

exporters:
  postgres:
    enabled: true
    image:
      repository: quay.io/prometheuscommunity/postgres-exporter
      tag: v0.20.1
  valkey:
    enabled: true
    image:
      repository: oliver006/redis_exporter
      tag: v1.93.0

backup:
  enabled: true
  # -- Cron schedule in UTC (default: every night at 02:30)
  schedule: "30 2 * * *"
  # -- S3 bucket created by Terraform (statusboard-eks-backups-<account id>). Set by CI.
  bucket: ""
  region: eu-west-2
  awsCliImage:
    repository: amazon/aws-cli
    tag: "2.37.10"

# Monthly snapshot of the database for the data team (CSV per table + full dump),
# written to the KMS-encrypted exports bucket created by Terraform.
dataExport:
  enabled: true
  # -- Cron schedule in UTC (default: 04:00 on the 1st of every month)
  schedule: "0 4 1 * *"
  # -- statusboard-eks-data-exports-<account id>. Set by CI.
  bucket: ""
  tables: [components, incidents, incident_updates]

# Leave empty: secrets are generated once and preserved on upgrades (see templates/secret.yaml).
# Database passwords are generated by the postgres-operator. Never commit real values.
auth:
  valkeyPassword: ""
  adminToken: ""

ingress:
  enabled: true
  className: alb
  host: status.example.com
  # -- All Ingresses with the same group name share ONE Application Load Balancer
  groupName: statusboard-platform
  # -- Leave empty to let the controller find the ACM certificate by host name
  certificateArn: ""

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    # -- Labels the Prometheus Operator selects on (kube-prometheus-stack release name)
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    # -- Severity of the most important alerts (critical in prod, warning in staging)
    severity: warning
    labels:
      release: kube-prometheus-stack
  grafanaDashboard:
    # -- Install the dashboard from ONE release only (prod); it has an environment drop-down
    enabled: false
