{{- if .Values.monitoring.grafanaDashboard.enabled }}
# The Grafana sidecar in kube-prometheus-stack loads every ConfigMap labelled
# grafana_dashboard: "1" from any namespace. The dashboard has an "environment"
# drop-down, so only ONE release (prod) installs it; otherwise Grafana would
# load two copies with the same ID.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "statusboard.fullname" . }}-dashboard
  labels:
    {{- include "statusboard.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  statusboard-overview.json: |-
{{ .Files.Get "dashboards/statusboard-overview.json" | indent 4 }}
{{- end }}
