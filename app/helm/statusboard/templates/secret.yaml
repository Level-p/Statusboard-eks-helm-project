{{- /*
Cache password and the admin API token. (Database passwords are created by the
postgres-operator in its own Secrets.)
"lookup" reads the Secret already in the cluster, so `helm upgrade` keeps the
same values. The keep policy stops `helm uninstall` from deleting it, because
the cache and API clients keep working with the same values after a reinstall.
*/ -}}
{{- $secretName := include "statusboard.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "statusboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  valkey-password: {{ include "statusboard.secretValue" (list $existing "valkey-password" .Values.auth.valkeyPassword 32) }}
  admin-token: {{ include "statusboard.secretValue" (list $existing "admin-token" .Values.auth.adminToken 40) }}
