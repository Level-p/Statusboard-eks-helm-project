{{- /* Rendered only when the Prometheus Operator CRDs exist (kube-prometheus-stack installed) */ -}}
{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "statusboard.fullname" . }}
  labels:
    {{- include "statusboard.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Scrapes every Service of this release that has a "metrics" port:
  # the app (9090), postgres-exporter (9187) and valkey-exporter (9121)
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      statusboard/metrics: "true"
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      path: /metrics
{{- end }}
