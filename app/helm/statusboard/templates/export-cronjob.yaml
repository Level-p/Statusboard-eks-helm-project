{{- if .Values.dataExport.enabled }}
{{- $pg := .Values.postgres -}}
{{- $sa := include "statusboard.exportServiceAccount" . -}}
# Write access to the exports bucket comes from EKS Pod Identity: Terraform links
# this ServiceAccount to an IAM role that may only ADD files to this environment's
# folder, encrypted with the exports KMS key. No AWS keys are stored in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "statusboard.labels" . | nindent 4 }}
---
# Monthly snapshot for the data team, read from a replica so the live site is not slowed down:
#   s3://<bucket>/<prod|staging>/snapshot_date=YYYY-MM-DD/
#     tables/<table>.csv.gz    one gzip-compressed CSV per table, with a header row
#     full/statusboard.dump    the whole database (pg_restore -d <db> statusboard.dump)
#     manifest.json            environment, time, PostgreSQL version and row counts
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "statusboard.fullname" . }}-data-export
  labels:
    {{- include "statusboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-export
spec:
  schedule: {{ .Values.dataExport.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            {{- include "statusboard.selectorLabels" (dict "root" . "component" "data-export") | nindent 12 }}
        spec:
          serviceAccountName: {{ $sa }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: export
              image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
              env:
                - name: PGHOST
                  value: {{ include "statusboard.postgresReadHost" . | quote }}
                - name: PGUSER
                  value: {{ $pg.user | quote }}
                - name: PGDATABASE
                  value: {{ $pg.database | quote }}
                - name: PGSSLMODE
                  value: require
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: {{ include "statusboard.postgresUserSecret" . }}, key: password }
                - name: ENVIRONMENT
                  value: {{ .Values.environment | quote }}
                - name: TABLES
                  value: {{ join " " .Values.dataExport.tables | quote }}
              command: ["sh", "-c"]
              # "$$(" stops Kubernetes from treating $(...) as one of its own variables
              args:
                - |
                  set -eo pipefail
                  OUT=/export
                  mkdir -p "$OUT/tables" "$OUT/full"
                  DATE=$$(date -u +%Y-%m-%d)
                  echo "$DATE" > "$OUT/.snapshot_date"
                  ROWS=""
                  for T in $TABLES; do
                    psql -v ON_ERROR_STOP=1 -c "\copy (SELECT * FROM $T ORDER BY id) TO STDOUT WITH (FORMAT csv, HEADER)" | gzip -9 > "$OUT/tables/$T.csv.gz"
                    N=$$(psql -At -c "SELECT count(*) FROM $T")
                    ROWS="$ROWS\"$T\": $N, "
                    echo "exported $T: $N rows"
                  done
                  pg_dump -Fc -f "$OUT/full/statusboard.dump"
                  VERSION=$$(psql -At -c "SHOW server_version")
                  printf '{\n  "environment": "%s",\n  "snapshot_date": "%s",\n  "exported_at": "%s",\n  "postgres_version": "%s",\n  "source": "read replica",\n  "format": {"tables": "csv, gzip, header row", "full": "pg_dump custom format"},\n  "row_counts": {%s}\n}\n' \
                    "$ENVIRONMENT" "$DATE" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$VERSION" "$${ROWS%, }" > "$OUT/manifest.json"
                  cat "$OUT/manifest.json"
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
              securityContext:
                {{- include "statusboard.containerSecurity" (dict "readOnly" true) | nindent 16 }}
              volumeMounts:
                - name: export
                  mountPath: /export
          containers:
            - name: upload
              image: "{{ .Values.backup.awsCliImage.repository }}:{{ .Values.backup.awsCliImage.tag }}"
              env:
                - name: AWS_REGION
                  value: {{ .Values.backup.region | quote }}
                - name: HOME
                  value: /tmp
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  DATE=$$(cat /export/.snapshot_date); rm /export/.snapshot_date
                  DEST="s3://{{ required "dataExport.bucket is required when exports are enabled" .Values.dataExport.bucket }}/{{ include "statusboard.envFolder" . }}/snapshot_date=$DATE/"
                  # The bucket encrypts every object with its KMS key (default encryption)
                  aws s3 cp /export/ "$DEST" --recursive --only-show-errors
                  # (this role may only write, not list: that is deliberate)
                  echo "Uploaded to $DEST:"; find /export -type f | sed 's|^/export/||'
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                {{- include "statusboard.containerSecurity" (dict "readOnly" false) | nindent 16 }}
              volumeMounts:
                - name: export
                  mountPath: /export
          volumes:
            - name: export
              emptyDir:
                sizeLimit: 10Gi
{{- end }}
